[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-cfg-wizard-ui"
version = "0.1.0a1"
description = "Framework-independent scalar configuration editor page"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yaml_cfg_wizard_ui = ["assets/*.html", "assets/*.css", "assets/*.js"]
