name: Test

on:
  push:
    branches: [main, devel, develop]
  pull_request:
    branches: [main, devel, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=src/yaml_cfg_wizard_ui --cov-report=term-missing
      
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/ || true
      
      - name: Security check (bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll || true
